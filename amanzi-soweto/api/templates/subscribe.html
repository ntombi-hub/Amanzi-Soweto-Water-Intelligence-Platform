<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amanzi Soweto — Subscribe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1e2130;
      border-radius: 14px;
      padding: 40px;
      width: 100%;
      max-width: 460px;
      border-top: 4px solid #C84B2F;
    }

    .logo { font-size: 2rem; margin-bottom: 8px; }
    h1 { font-size: 1.5rem; color: #fff; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 28px; }

    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 6px; }

    input, select {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 10px 14px;
      margin-bottom: 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #C84B2F; }

    select option { background: #1e2130; }

    .btn {
      width: 100%;
      background: #C84B2F;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #a83a22; }

    .alert {
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .alert-success { background: #1a2d1a; border-left: 4px solid #44bb44; color: #88dd88; }
    .alert-error   { background: #3d1a1a; border-left: 4px solid #ff4444; color: #ff8888; }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: #555;
    }
    .footer a { color: #888; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">💧</div>
    <h1>Amanzi Soweto</h1>
    <p class="subtitle">Get WhatsApp or SMS alerts when water is cut in your suburb.</p>

    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="POST" action="/subscribe/form">
      <label for="phone_number">Phone number (with country code)</label>
      <input
        type="tel"
        id="phone_number"
        name="phone_number"
        placeholder="+27821234567"
        required
      />

      <label for="suburb_name">Your suburb</label>
      <select id="suburb_name" name="suburb_name" required>
        <option value="" disabled selected>Select your suburb…</option>
        {% for suburb in suburbs %}
        <option value="{{ suburb }}">{{ suburb }}</option>
        {% endfor %}
      </select>

      <label for="channel">How do you want to be notified?</label>
      <select id="channel" name="channel">
        <option value="whatsapp" selected>WhatsApp</option>
        <option value="sms">SMS</option>
      </select>

      <button type="submit" class="btn">Subscribe to Alerts</button>
    </form>

    <div class="footer">
      <p>Reply STOP to any message to unsubscribe.</p>
      <p style="margin-top:6px">
        <a href="/alerts">View active alerts</a> &nbsp;·&nbsp;
        <a href="/docs">API docs</a>
      </p>
    </div>
  </div>
</body>
</html>
